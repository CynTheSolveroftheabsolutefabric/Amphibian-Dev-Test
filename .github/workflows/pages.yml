name: Build and deploy to GitHub Pages

# MANUAL ONLY - do not run on push.
# The WASM build is heavy; the caches below make a second run reuse the
# downloaded statics, NuGet packages, ikvmc bundles, and incremental .NET
# intermediates instead of starting over.
on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install frontend dependencies
        run: |
          pnpm config set store-dir ~/.pnpm-store
          cd frontend && pnpm install

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('loader/IkvmWasm.csproj', 'loader/Generated.targets', 'loader/ikvmc-manifest.g.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache downloaded statics
        uses: actions/cache@v4
        with:
          path: statics
          key: statics-${{ runner.os }}-f436b72b-adfb-4c28-9cd7-8e2493f8e815-b9449e8c-10b5-49aa-a57a-365348d837fe

      - name: Cache loader build
        uses: actions/cache@v4
        with:
          path: |
            loader/bin
            loader/obj
            jars
          key: loader-${{ runner.os }}-${{ hashFiles('Makefile', 'build-ikvmc.py', 'ikvmc.sh', 'loader/**', 'aotprofile/**', 'jars/**') }}
          restore-keys: loader-${{ runner.os }}-

      - name: Install mono
        run: sudo apt-get update && sudo apt-get install -y mono-devel

      - name: Build
        run: |
          cd loader && dotnet workload restore && cd ..
          make -j"$(nproc)" statics
          make publish AOT=true OPT=false

      # Pages serves files as-is, so make sure Jekyll never touches the _framework folder.
      - run: touch frontend/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
